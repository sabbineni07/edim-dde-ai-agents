bundle:
  name: edim-dde-ai-agents-api

variables:
  app_name:
    description: Databricks App name
    default: edim-dde-ai-agents-api
  app_description:
    description: Databricks App description
    default: Cluster advisor FastAPI Databricks App
  postgres_branch:
    description: Lakebase branch path (projects/.../branches/...)
  postgres_database:
    description: Lakebase database path (.../databases/db-...)
  sql_warehouse_id:
    description: SQL warehouse id used for metrics browse/recommend
  faiss_volume_full_name:
    description: Unity Catalog volume full name (catalog.schema.volume)

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    api:
      name: ${var.app_name}
      description: ${var.app_description}
      source_code_path: ./deploy/databricks-app
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: faiss-volume
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.faiss_volume_full_name}
            permission: WRITE_VOLUME

targets:
  dev:
    default: true

  prod:
    resources:
      apps:
        api:
          name: ${var.app_name}
