# Per-agent overrides (win over config/platform.yaml). Secrets stay in env.
agent_id: dbx_cluster_tuning_agent

llm:
  deployment: ${env:AZURE_OPENAI_DEPLOYMENT_NAME}
  default_model_name: gpt-4o
  temperature: 0
  top_p: 1.0
  explanation_temperature: 0.2

rag:
  enabled: false
  backend: none
  top_k_recommendations: 3
  top_k_jobs: 5

sizing:
  recommendation_auto_termination_minutes: 0
  cost_retry_enabled: true
  default_confidence_score: 0.85
  default_monthly_budget: 500.0

guardrails:
  max_job_id_length: 256
  max_date_range_days: 30
  supported_intent: cluster_recommendation
