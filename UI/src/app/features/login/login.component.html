<div class="login-container">
  <div class="login-brand-panel">
    <i class="bi bi-lightbulb login-brand-icon" aria-hidden="true"></i>
    <h1 class="login-brand-title">Insights Hub</h1>
    <p class="login-brand-tagline">Databricks workload insights and AI recommendations</p>
  </div>
  <div class="login-form-panel">
    <div class="login-card card">
      <div class="card-body">
        <h2 class="login-form-title">Sign in</h2>
        <p class="login-form-subtitle text-muted">Use your credentials to continue</p>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-2">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control form-control-sm" formControlName="username" [class.is-invalid]="submitted && f['username'].errors" placeholder="Username" />
            <div class="invalid-feedback" *ngIf="submitted && f['username'].errors?.['required']">Required</div>
          </div>
          <div class="mb-2">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control form-control-sm" formControlName="password" [class.is-invalid]="submitted && f['password'].errors" placeholder="Password" />
            <div class="invalid-feedback" *ngIf="submitted && f['password'].errors?.['required']">Required</div>
            <div class="invalid-feedback" *ngIf="submitted && f['password'].errors?.['minlength']">At least 4 characters</div>
          </div>
          <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-sm" [disabled]="loading">
              <span *ngIf="!loading">Sign In</span>
              <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-1"></span>Signing in…</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
