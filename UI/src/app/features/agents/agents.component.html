<div class="page-header mb-4">
  <h2 class="mb-0"><i class="bi bi-robot me-2"></i>AI Agents</h2>
  <p class="text-muted small mb-0 mt-1">
    Agent catalog. Install agents per workspace with connections — open
    <a routerLink="/app/workspaces">Workspaces</a> → <strong>Setup</strong>.
  </p>
</div>

<div *ngIf="loading" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></div>

<div class="row g-3" *ngIf="!loading">
  <div class="col-md-6 col-lg-4" *ngFor="let a of agents">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ a.name }}</h5>
        <p class="card-text small text-muted mb-2"><code>{{ a.agent_id }}</code></p>
        <p class="card-text small">{{ a.description }}</p>
        <a class="btn btn-primary btn-sm" routerLink="/app/workspaces">Choose workspace</a>
      </div>
    </div>
  </div>
</div>
