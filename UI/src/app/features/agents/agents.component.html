<app-page-header
  title="AI Agents"
  icon="robot"
  subtitle="Agent catalog. Install agents per workspace via Workspaces → Settings."
></app-page-header>

<app-loading-card *ngIf="loading"></app-loading-card>

<div class="row g-2" *ngIf="!loading">
  <div class="col-md-6 col-lg-4" *ngFor="let a of agents">
    <div class="card h-100">
      <div class="card-body">
        <h3 class="h6 mb-1">{{ a.name }}</h3>
        <p class="small text-muted mb-1"><code>{{ a.agent_id }}</code></p>
        <p class="small mb-2">{{ a.description }}</p>
        <a class="btn btn-primary btn-sm" routerLink="/app/workspaces">Choose workspace</a>
      </div>
    </div>
  </div>
</div>

<div class="card" *ngIf="!loading && !agents.length">
  <div class="card-body">
    <app-empty-state icon="robot" title="No agents in catalog" description="Agents will appear when registered on the platform."></app-empty-state>
  </div>
</div>
