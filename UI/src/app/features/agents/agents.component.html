<app-page-header
  title="AI Agents"
  icon="robot"
  subtitle="Platform agent catalog. Install an agent on a workspace to run recommendations and analysis."
></app-page-header>

<app-loading-card *ngIf="loading" variant="skeleton" [skeletonRows]="3"></app-loading-card>

<div class="agent-grid" *ngIf="!loading && agents.length">
  <div class="agent-card card" *ngFor="let a of agents">
    <div class="card-body d-flex flex-column">
      <div class="agent-card-header">
        <div class="agent-icon" aria-hidden="true">
          <i class="bi" [ngClass]="agentIcon(a.agent_id)"></i>
        </div>
        <app-status-badge [label]="agentCategory(a.agent_id)" variant="default"></app-status-badge>
      </div>
      <h3 class="agent-card-title">{{ a.name }}</h3>
      <p class="agent-card-id"><code>{{ a.agent_id }}</code></p>
      <p class="agent-card-desc">{{ a.description }}</p>
      <div class="agent-card-actions mt-auto d-flex flex-wrap gap-2">
        <a class="btn btn-outline-primary btn-sm" [routerLink]="['/app/agents', a.agent_id]">
          <i class="bi bi-journal-text me-1"></i> View prompts &amp; skills
        </a>
        <button type="button" class="btn btn-primary btn-sm" (click)="installInWorkspace()">
          <i class="bi bi-box-arrow-in-down me-1"></i> Install in workspace
        </button>
        <a class="btn btn-outline-secondary btn-sm" routerLink="/app/workspaces">Workspaces</a>
      </div>
    </div>
  </div>
</div>

<div class="card" *ngIf="!loading && !agents.length">
  <div class="card-body">
    <app-empty-state
      icon="robot"
      title="No agents in catalog"
      description="Agents appear here when registered on the platform."
    ></app-empty-state>
  </div>
</div>
