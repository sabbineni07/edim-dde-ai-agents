<app-page-header
  title="Chat"
  icon="chat-dots"
  subtitle="Ask questions using your environment's AI Foundry LLM and an optional knowledge index."
>
  <div actions class="page-actions">
    <button
      class="btn btn-outline-secondary btn-sm"
      type="button"
      (click)="toggleSettings()"
      [disabled]="!environmentId"
      [attr.aria-expanded]="showSettings"
    >
      <i class="bi bi-sliders me-1"></i> Settings
    </button>
  </div>
</app-page-header>

<div class="card mb-2 chat-settings-panel" *ngIf="showSettings && environmentId">
  <div class="card-body py-3">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label small">Environment</label>
        <div class="form-control form-control-sm bg-light">{{ environmentName }}</div>
      </div>
      <div class="col-md-4">
        <label class="form-label small">AI Foundry connection <span class="text-danger">*</span></label>
        <select class="form-select form-select-sm" [(ngModel)]="llmConnectionId" [disabled]="!llmConnections.length">
          <option value="" disabled>Select LLM connection</option>
          <option *ngFor="let c of llmConnections" [value]="c.id">{{ connectionLabel(c) }}</option>
        </select>
        <div class="form-text" *ngIf="!llmConnections.length">
          No Foundry connections. <a routerLink="/app/connections">Add one</a>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Knowledge index (optional)</label>
        <select class="form-select form-select-sm" [(ngModel)]="ragConnectionId">
          <option value="">None (LLM only)</option>
          <option *ngFor="let c of ragConnections" [value]="c.id">{{ connectionLabel(c) }}</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="alert alert-warning py-2" *ngIf="!environmentId">
  Select an environment in the header to use Chat.
</div>

<app-error-alert [message]="error" (dismiss)="error = ''"></app-error-alert>

<div class="chat-shell card" *ngIf="environmentId">
  <div class="chat-messages-wrap" #messageList>
    <div class="chat-empty" *ngIf="!hasMessages && !loading">
      <app-empty-state
        icon="chat-dots"
        title="Start a conversation"
        description="Ask about cluster metrics, recommendations, or platform setup."
        [compact]="false"
      ></app-empty-state>
      <div class="chat-prompts">
        <p class="chat-prompts-label">Suggested prompts</p>
        <div class="chat-prompts-list">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm chat-prompt-btn"
            *ngFor="let prompt of suggestedPrompts"
            (click)="usePrompt(prompt)"
          >
            {{ prompt }}
          </button>
        </div>
      </div>
    </div>

    <div
      *ngFor="let m of messages; let i = index"
      class="chat-row"
      [class.chat-row-user]="m.role === 'user'"
      [class.chat-row-assistant]="m.role === 'assistant'"
    >
      <div class="chat-avatar" [class.chat-avatar-user]="m.role === 'user'" [class.chat-avatar-assistant]="m.role === 'assistant'" aria-hidden="true">
        <i class="bi" [ngClass]="m.role === 'user' ? 'bi-person-fill' : 'bi-robot'"></i>
      </div>
      <div class="chat-content">
        <div class="chat-bubble" [class.chat-bubble-user]="m.role === 'user'" [class.chat-bubble-assistant]="m.role === 'assistant'">
          <ng-container *ngIf="m.role === 'assistant'; else userMessage">
            <app-markdown-content [content]="m.content"></app-markdown-content>
          </ng-container>
          <ng-template #userMessage>{{ m.content }}</ng-template>
        </div>
        <div class="chat-sources" *ngIf="m.sources?.length && m.role === 'assistant'">
          <div class="chat-sources-header">Sources ({{ m.sources!.length }})</div>
          <div class="chat-source-chips">
            <button
              type="button"
              class="chat-source-chip"
              *ngFor="let s of m.sources; let si = index"
              [class.expanded]="isSourceExpanded(sourceKey(i, si))"
              (click)="toggleSource(sourceKey(i, si))"
            >
              <span class="chat-source-type">{{ s.document_type }}</span>
              <span class="chat-source-score" *ngIf="s.score != null">{{ s.score | number:'1.2-2' }}</span>
            </button>
          </div>
          <div
            class="chat-source-detail"
            *ngFor="let s of m.sources; let si = index"
            [class.d-none]="!isSourceExpanded(sourceKey(i, si))"
          >
            <p class="mb-0">{{ s.excerpt }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-row chat-row-assistant" *ngIf="loading">
      <div class="chat-avatar chat-avatar-assistant" aria-hidden="true">
        <i class="bi bi-robot"></i>
      </div>
      <div class="chat-content">
        <div class="chat-bubble chat-bubble-assistant chat-thinking">
          <span class="chat-typing-dots" aria-label="Assistant is thinking">
            <span></span><span></span><span></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-composer">
    <textarea
      #questionInput
      class="form-control chat-input"
      rows="2"
      [(ngModel)]="question"
      placeholder="Ask a question… (Enter to send, Shift+Enter for new line)"
      (keydown)="onQuestionKeydown($event)"
      [disabled]="!environmentId || !llmConnectionId"
    ></textarea>
    <button class="btn btn-primary chat-send" type="button" (click)="send()" [disabled]="!canSend">
      <i class="bi bi-send-fill"></i>
      <span class="visually-hidden">Send</span>
    </button>
  </div>
</div>
