<app-page-header
  title="Chat"
  icon="chat-dots"
  subtitle="Ask questions using your environment's AI Foundry LLM and an optional knowledge index."
></app-page-header>

<div class="alert alert-warning py-2" *ngIf="!environmentId">
  Select an environment in the header to use Chat.
</div>

<div class="row mb-2 g-2" *ngIf="environmentId">
  <div class="col-md-4">
    <label class="form-label">Environment</label>
    <div class="form-control form-control-sm">{{ environmentName }}</div>
  </div>
  <div class="col-md-4">
    <label class="form-label">AI Foundry connection <span class="text-danger">*</span></label>
    <select class="form-select form-select-sm" [(ngModel)]="llmConnectionId" [disabled]="!llmConnections.length">
      <option value="" disabled>Select LLM connection</option>
      <option *ngFor="let c of llmConnections" [value]="c.id">{{ connectionLabel(c) }}</option>
    </select>
    <div class="form-text" *ngIf="!llmConnections.length">
      No Foundry connections. <a routerLink="/app/connections">Add one</a>
    </div>
  </div>
  <div class="col-md-4">
    <label class="form-label">Knowledge index (optional)</label>
    <select class="form-select form-select-sm" [(ngModel)]="ragConnectionId">
      <option value="">None (LLM only)</option>
      <option *ngFor="let c of ragConnections" [value]="c.id">{{ connectionLabel(c) }}</option>
    </select>
    <div class="form-text" *ngIf="!ragConnections.length">
      Optional: <a routerLink="/app/connections">Connections</a>
    </div>
  </div>
</div>

<div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

<div class="card chat-card">
  <div class="card-body d-flex flex-column chat-card-body">
    <div #messageList class="flex-grow-1 overflow-auto mb-2 chat-messages">
      <div *ngFor="let m of messages" class="mb-2 chat-message" [class.text-end]="m.role === 'user'">
        <span class="badge" [class.bg-primary]="m.role === 'user'" [class.bg-secondary]="m.role === 'assistant'">{{ m.role }}</span>
        <div class="mt-1 chat-bubble" [class.chat-bubble-user]="m.role === 'user'" [class.chat-bubble-assistant]="m.role === 'assistant'">
          <ng-container *ngIf="m.role === 'assistant'; else userMessage">
            <app-markdown-content [content]="m.content"></app-markdown-content>
          </ng-container>
          <ng-template #userMessage>{{ m.content }}</ng-template>
        </div>
        <div class="small text-muted mt-1" *ngIf="m.sources?.length && m.role === 'assistant'">
          <div class="fw-semibold mb-1">Sources ({{ m.sources!.length }})</div>
          <ul class="list-unstyled mb-0 chat-sources">
            <li *ngFor="let s of m.sources" class="mb-1">
              <span class="badge bg-light text-dark border me-1">{{ s.document_type }}</span>
              <span *ngIf="s.score != null" class="me-1">score {{ s.score | number:'1.2-4' }}</span>
              {{ s.excerpt }}
            </li>
          </ul>
        </div>
      </div>
      <div *ngIf="loading" class="text-muted chat-thinking">
        <span class="spinner-border spinner-border-sm me-1"></span>Thinking...
      </div>
    </div>
    <div class="d-flex gap-2">
      <input type="text" class="form-control form-control-sm" [(ngModel)]="question" placeholder="Ask a question..." (keydown.enter)="send()" [disabled]="!environmentId" />
      <button class="btn btn-primary btn-sm" (click)="send()" [disabled]="!canSend">Send</button>
    </div>
  </div>
</div>
