<app-page-header
  title="Workspaces"
  icon="building"
  [subtitle]="environmentName ? 'Environment: ' + environmentName : 'Select an environment from the header to browse workspaces.'"
>
  <div subtitle-extra *ngIf="environmentName && metricsDatasetName" class="page-subtitle">
    Dataset: <strong>{{ metricsDatasetName }}</strong>
    <span *ngIf="metricsDatasetRef"> (<code>{{ metricsDatasetRef }}</code>)</span>
    <a routerLink="/app/datasets" class="ms-1">Manage</a>
  </div>
  <div actions class="page-actions">
    <div *ngIf="showDatasetPicker" class="d-flex align-items-center gap-2">
      <label class="form-label small mb-0">Dataset</label>
      <select
        class="form-select form-select-sm"
        style="min-width: 10rem;"
        [ngModel]="selectedDatasetId"
        (ngModelChange)="onDatasetChange($event)"
      >
        <option *ngFor="let d of datasets" [value]="d.id">
          {{ d.name }}{{ d.is_default ? ' (default)' : '' }}
        </option>
      </select>
    </div>
    <div *ngIf="showConnectionPicker" class="d-flex align-items-center gap-2">
      <label class="form-label small mb-0">Connection</label>
      <select
        class="form-select form-select-sm"
        style="min-width: 10rem;"
        [ngModel]="selectedConnectionId"
        (ngModelChange)="onConnectionChange($event)"
      >
        <option *ngFor="let c of databricksConnections" [value]="c.id">
          {{ c.name }}{{ c.is_default ? ' (default)' : '' }}
        </option>
      </select>
    </div>
    <button class="btn btn-refresh btn-sm" (click)="refreshWorkspaces()" [disabled]="loading">
      <i class="bi bi-arrow-clockwise" [class.spin]="loading"></i> Refresh
    </button>
  </div>
</app-page-header>

<div class="alert alert-info py-2" *ngIf="!environmentId && !loading">
  Select an environment from the header to browse workspaces.
</div>

<div
  class="alert alert-warning alert-dismissible fade show py-2"
  role="alert"
  *ngIf="error && !errorDismissed"
>
  {{ error }}
  <span *ngIf="error.includes('connection')" class="ms-1">
    <a routerLink="/app/connections">Configure in Connections</a>
  </span>
  <button type="button" class="btn-close" aria-label="Dismiss" (click)="dismissError()"></button>
</div>

<app-loading-card *ngIf="loading" message="Loading workspaces…"></app-loading-card>

<div class="card" *ngIf="!loading && workspaces.length === 0 && !error && environmentId">
  <div class="card-body">
    <app-empty-state
      icon="building"
      title="No workspaces found"
      description="Configure a Databricks connection, then refresh."
      actionLabel="Go to Connections"
      actionLink="/app/connections"
    ></app-empty-state>
  </div>
</div>

<div class="table-responsive card" *ngIf="!loading && workspaces.length > 0">
  <table class="table table-hover table-compact table-sticky align-middle mb-0">
    <thead>
      <tr>
        <th>Workspace</th>
        <th>ID</th>
        <th>Jobs</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let w of workspaces">
        <td>{{ w.workspace_name || w.workspace_id }}</td>
        <td><code class="small">{{ w.workspace_id }}</code></td>
        <td>{{ w.job_count }}</td>
        <td class="text-nowrap text-end">
          <button class="btn btn-primary btn-sm me-1" (click)="openJobs(w)">Jobs</button>
          <button class="btn btn-outline-secondary btn-sm" (click)="openWorkspaceSetup(w)" title="Workspace settings">
            <i class="bi bi-gear"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
