<div class="shell">
  <header class="shell-header">
    <div class="header-content">
      <div class="header-left">
        <button class="sidebar-toggle-btn" (click)="toggleSidebar()" type="button" aria-label="Toggle sidebar">
          <i class="bi" [ngClass]="sidebarOpen ? 'bi-chevron-left' : 'bi-chevron-right'"></i>
        </button>
        <i class="bi bi-lightbulb app-icon me-2"></i>
        <h1 class="app-title">Insights Hub</h1>
      </div>
      <div class="header-right">
        <div class="dropdown env-dropdown" *ngIf="environments.length">
          <button
            class="btn btn-outline-light btn-sm dropdown-toggle env-switcher"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Switch metrics environment"
          >
            <i class="bi bi-layers me-1"></i>
            {{ selectedEnvironment?.displayName || 'Select environment' }}
          </button>
          <ul class="dropdown-menu">
            <li *ngFor="let env of environments">
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                type="button"
                [class.active]="selectedEnvironment?.id === env.id"
                (click)="selectEnvironment(env)"
              >
                <span>{{ env.display_name }}</span>
                <span class="badge bg-secondary ms-2">{{ env.environment_tier }}</span>
              </button>
            </li>
          </ul>
        </div>
        <span class="user-text">{{ username }}</span>
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i> Account
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text text-muted small">{{ username }}</span></li>
            <li *ngIf="isAdmin"><hr class="dropdown-divider"></li>
            <li *ngIf="isAdmin">
              <button class="dropdown-item" type="button" (click)="manageEnvironments()">
                <i class="bi bi-sliders me-2"></i>Manage environments
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" type="button" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="shell-body">
    <div
      class="alert mx-3 mt-2 mb-0 py-2 small"
      [ngClass]="environmentsLoadFailed ? 'alert-danger' : 'alert-warning'"
      *ngIf="environmentsLoadError"
    >
      {{ environmentsLoadError }}
    </div>
    <app-sidebar
      [menuItems]="menuItems"
      [activeMenuItem]="activeMenuItem"
      [isOpen]="sidebarOpen"
      (menuItemClick)="onMenuItemClick($event)"
    ></app-sidebar>
    <main class="main-content" [class.sidebar-closed]="!sidebarOpen">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="modal fade show d-block" tabindex="-1" *ngIf="showEnvPicker" style="background: rgba(0,0,0,0.4);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Choose environment</h5>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Select the metrics environment for this session.</p>
        <div class="list-group">
          <button
            type="button"
            class="list-group-item list-group-item-action"
            *ngFor="let env of environments"
            (click)="selectEnvironment(env)"
          >
            <strong>{{ env.display_name }}</strong>
            <span class="badge bg-secondary ms-2">{{ env.environment_tier }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
