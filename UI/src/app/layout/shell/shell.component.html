<div class="shell">
  <header class="shell-header">
    <div class="header-content">
      <div class="header-left">
        <button
          class="sidebar-toggle-btn"
          (click)="toggleSidebar()"
          type="button"
          [attr.aria-label]="sidebarExpanded ? 'Collapse sidebar' : 'Expand sidebar'"
          [attr.aria-expanded]="sidebarExpanded"
        >
          <i class="bi" [ngClass]="sidebarExpanded ? 'bi-layout-sidebar-inset' : 'bi-layout-sidebar'"></i>
        </button>
        <i class="bi bi-lightbulb app-icon" aria-hidden="true"></i>
        <h1 class="app-title">Insights Hub</h1>
      </div>
      <div class="header-right">
        <div class="dropdown env-dropdown" *ngIf="environments.length">
          <button
            class="btn btn-sm env-switcher"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            title="Switch metrics environment"
            [attr.aria-label]="'Environment: ' + selectedEnvironmentShortName"
          >
            <span class="env-tier-badge" *ngIf="selectedEnvironmentTier">{{ selectedEnvironmentTier }}</span>
            <span class="env-switcher-name">{{ selectedEnvironmentShortName }}</span>
            <i class="bi bi-chevron-down env-switcher-chevron" aria-hidden="true"></i>
          </button>
          <ul class="dropdown-menu">
            <li *ngFor="let env of environments">
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                type="button"
                [class.active]="selectedEnvironment?.id === env.id"
                (click)="selectEnvironment(env)"
              >
                <span>{{ env.display_name }}</span>
                <span class="badge bg-secondary ms-2">{{ env.environment_tier }}</span>
              </button>
            </li>
          </ul>
        </div>
        <div class="dropdown">
          <button
            class="btn btn-sm account-menu-btn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            [attr.aria-label]="'Account menu for ' + username"
            title="{{ username }}"
          >
            <span class="account-avatar" aria-hidden="true">{{ userInitials }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text text-muted small">{{ username }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item" type="button" (click)="toggleTheme()">
                <i class="bi me-2" [ngClass]="theme.current === 'light' ? 'bi-moon-stars' : 'bi-sun'"></i>
                {{ themeLabel }}
              </button>
            </li>
            <li *ngIf="isAdmin"><hr class="dropdown-divider"></li>
            <li *ngIf="isAdmin">
              <button class="dropdown-item" type="button" (click)="manageEnvironments()">
                <i class="bi bi-sliders me-2"></i>Manage environments
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item" type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <app-context-bar
    *ngIf="showContextBar"
    [datasetName]="contextDatasetName"
    [connectionName]="contextConnectionName"
  ></app-context-bar>

  <div
    class="shell-banner alert alert-dismissible fade show mb-0 rounded-0 border-0 border-bottom"
    [ngClass]="environmentsLoadFailed ? 'alert-danger' : 'alert-warning'"
    role="alert"
    *ngIf="environmentsLoadError && !environmentsLoadErrorDismissed"
  >
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    {{ environmentsLoadError }}
    <button
      *ngIf="environmentsLoadFailed"
      type="button"
      class="btn btn-sm btn-outline-dark ms-2"
      (click)="retryLoadEnvironments()"
    >
      Retry
    </button>
    <button
      type="button"
      class="btn-close"
      aria-label="Dismiss"
      (click)="dismissEnvironmentsLoadError()"
    ></button>
  </div>

  <div class="shell-body">
    <app-sidebar
      [menuItems]="menuItems"
      [activeMenuItem]="activeMenuItem"
      [expanded]="sidebarExpanded"
      (menuItemClick)="onMenuItemClick($event)"
    ></app-sidebar>
    <main class="main-content">
      <router-outlet></router-outlet>

      <div class="env-picker-overlay" *ngIf="showEnvPicker" role="dialog" aria-modal="true" aria-labelledby="envPickerTitle">
        <div class="env-picker-dialog card shadow">
          <div class="card-header py-2">
            <h5 class="modal-title fs-6 mb-0" id="envPickerTitle">Choose environment</h5>
          </div>
          <div class="card-body py-2">
            <p class="text-muted small mb-2">Select the metrics environment for this session. You can also switch later from the header.</p>
            <div class="list-group list-group-flush">
              <button
                type="button"
                class="list-group-item list-group-item-action py-2"
                *ngFor="let env of environments"
                (click)="selectEnvironment(env)"
              >
                <strong class="small">{{ env.display_name }}</strong>
                <span class="badge bg-secondary ms-2">{{ env.environment_tier }}</span>
              </button>
            </div>
            <button type="button" class="btn btn-link btn-sm px-0 mt-2" (click)="dismissEnvPicker()">
              Continue without selecting
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
