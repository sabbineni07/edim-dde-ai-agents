<div class="context-bar" *ngIf="hasContent" role="status" aria-label="Active data context">
  <a
    *ngIf="datasetName"
    class="context-chip context-chip-link"
    [routerLink]="datasetLink"
    title="View datasets"
  >
    <i class="bi bi-table" aria-hidden="true"></i>
    <span class="context-label">Dataset</span>
    <span class="context-value">{{ datasetName }}</span>
  </a>
  <a
    *ngIf="connectionName"
    class="context-chip context-chip-link"
    [routerLink]="connectionLink"
    title="View connections"
  >
    <i class="bi bi-plug" aria-hidden="true"></i>
    <span class="context-label">Connection</span>
    <span class="context-value">{{ connectionName }}</span>
  </a>
</div>
