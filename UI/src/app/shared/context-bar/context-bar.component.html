<div class="context-bar" *ngIf="hasContent" role="status" aria-label="Session context">
  <span *ngIf="environmentName" class="context-chip">
    <i class="bi bi-layers" aria-hidden="true"></i>
    <span class="context-label">Env</span>
    <span class="context-value">{{ environmentName }}</span>
  </span>
  <span *ngIf="datasetName" class="context-chip">
    <i class="bi bi-table" aria-hidden="true"></i>
    <span class="context-label">Dataset</span>
    <span class="context-value">{{ datasetName }}</span>
  </span>
  <span *ngIf="connectionName" class="context-chip">
    <i class="bi bi-plug" aria-hidden="true"></i>
    <span class="context-label">Connection</span>
    <span class="context-value">{{ connectionName }}</span>
  </span>
</div>
